# Testleri çalıştırır, siteyi derler ve derlenmiş hâli gh-pages dalına yazar.
# GitHub Pages bu daldan yayın yapar (Settings → Pages → Deploy from a branch: gh-pages).
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # gh-pages dalına yazabilmek için

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Derlenmiş klasörü tek commit'lik gh-pages dalı olarak gönderir (eski hâlin yerine geçer)
      - name: gh-pages dalına yayınla
        run: |
          cd client/dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Yayın: ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
