    <meta name="theme-color" content="#ecd2ce" />
    <!-- Tema, sayfa çizilmeden önce ayarlanır: açık temada koyu bir an görünmez -->
    <script>
      (function () {
        var t = null;
        try {
          t = localStorage.getItem("gul-tema");
        } catch (e) {}
        // Seçim yoksa sitenin kendi rengi: toz pembe açık tema
        if (t !== "light" && t !== "dark") t = "light";

          document.documentElement.appendChild(p);
          var c = getComputedStyle(p).backgroundColor.match(/\d+/g);
          p.remove();
          if (c && c.length >= 3 && (+c[0] + +c[1] + +c[2]) / 3 < 100) t = "dark";
        } catch (e) {}
        document.documentElement.dataset.theme = t;
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.content = t === "dark" ? "#26151b" : "#ecd2ce";
      })();
